[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "支持多种模型后端的模块化 AI 编码智能体"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.60",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[project.scripts]
coding-agent = "coding_agent_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
